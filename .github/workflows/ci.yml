name: Verificações

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar o navegador dos testes
        run: npx playwright install --with-deps chromium
      - name: Tipos, build, links, navegação e acessibilidade
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-dos-testes
          path: test-results/
          retention-days: 7
